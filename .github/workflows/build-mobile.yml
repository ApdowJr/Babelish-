name: Build mobile (Android APK)

# 👋 SOOMAALI: GitHub → Actions → "Build mobile (Android APK)" → Run workflow
#    → markuu dhamaado, APK-ga ka soo deji "Artifacts" xagga hoose.
#
# This workflow builds the installable Android APK WITHOUT an Expo/EAS
# account. It is manual (workflow_dispatch) so it never burns CI minutes
# on every push — press the button when you want a fresh APK.
#
# Honest limits (read docs/BUILD_MOBILE.md):
#   • Babelish is Android-only (owner decision): there is no iOS build.
#   • The APK is signed with the debug keystore that `expo prebuild`
#     generates. It installs directly on any Android phone (share it,
#     e.g. via WhatsApp/file transfer) but it can NOT be uploaded to
#     Google Play. For Play, use EAS `production` (.aab).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: babelish-build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android APK (direct install)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Release gate
        run: npm run check:release

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://dvgluivslmdrqsvlscmj.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3gUzX0UPMmaxobj3bHULqw_hvmWLqYU

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://dvgluivslmdrqsvlscmj.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3gUzX0UPMmaxobj3bHULqw_hvmWLqYU

      - name: Collect APK
        run: |
          mkdir -p build-output
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "::error::No APK was produced"; exit 1; }
          cp "$APK" "build-output/Babelish-${GITHUB_SHA::7}.apk"
          ls -lh build-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: babelish-android-apk
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: babelish-android-build-${{ github.run_number }}
          name: Babelish Android APK (build ${{ github.run_number }})
          body: |
            Android APK built from commit ${{ github.sha }}.

            Install this APK directly on an Android phone. This is a debug-signed build for testing and direct installation, not a Google Play Store release.
          prerelease: true
          files: build-output/*.apk

