name: Babelish CI

on:
  pull_request:
  push:
    branches:
      - main
      - upgrade/zelvoca-production-hardening

permissions:
  contents: read

concurrency:
  group: babelish-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, types, lint, web export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: App TypeScript check
        run: npx tsc --noEmit

      - name: Supabase Edge Function type check
        run: deno check supabase/functions/babelish-ai/index.ts supabase/functions/delete-account/index.ts

      - name: Expo lint
        run: npm run lint

      - name: Export web build
        run: npm run build:web

      - name: Export Android build
        run: npm run build
