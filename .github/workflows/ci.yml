name: Babelish CI

on:
  pull_request:
  push:
    branches:
      - main
      - upgrade/zelvoca-production-hardening

permissions:
  contents: read

concurrency:
  group: babelish-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, types, lint, Android + iOS exports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: App TypeScript check
        run: npx tsc --noEmit

      - name: Supabase Edge Function type check
        run: deno check supabase/functions/babelish-ai/index.ts supabase/functions/delete-account/index.ts

      - name: Expo lint
        run: npm run lint

      - name: Release gate (native-only, store invariants)
        run: npm run check:release

      # Native-only app: BOTH phone platforms must bundle. There is no web
      # export any more — `app.json` declares platforms: ["android", "ios"].
      - name: Export Android bundle
        run: npm run build:android

      - name: Export iOS bundle
        run: npm run build:ios
