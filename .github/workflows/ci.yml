name: Babelish CI

on:
  pull_request:
  push:
    branches:
      - main
      - upgrade/zelvoca-production-hardening

permissions:
  contents: read

concurrency:
  group: babelish-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, types, lint, web export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: App TypeScript check
        run: npx tsc --noEmit

      - name: Neon Function TypeScript check
        run: npm run check:functions

      - name: Expo lint
        run: npm run lint

      - name: Export web build
        run: npm run build:web
