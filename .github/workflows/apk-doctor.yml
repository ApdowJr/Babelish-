name: APK doctor

# Temporary: opens the APK that is already published and prints exactly what is
# wrong with it. Android only says "package appears to be invalid"; this says
# whether the file is signed, with which schemes, for which ABIs, and whether it
# is an APK at all. Writes reports/apk-doctor.md so the result can be read from
# a machine that cannot download release assets.

on:
  push:
    paths:
      - '.github/workflows/apk-doctor.yml'
      - '.apk-doctor-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'babelish.apk' --dir /tmp/apk --clobber
          ls -l /tmp/apk

      - name: Inspect
        run: |
          set -uo pipefail
          APK=/tmp/apk/babelish.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          mkdir -p reports
          exec > >(tee reports/apk-doctor.md) 2>&1

          echo "# APK doctor"
          echo
          echo "build-tools: $BUILD_TOOLS"
          echo
          echo "## The file"
          echo '```'
          ls -l "$APK"
          sha256sum "$APK"
          echo "size: $(stat -c%s "$APK") bytes"
          echo "zip magic: $(head -c 2 "$APK")"
          echo "APK Sig Block 42 count: $(grep -a -c 'APK Sig Block 42' "$APK" || true)"
          echo '```'
          echo
          echo "## Zip integrity"
          echo '```'
          unzip -t "$APK" 2>&1 | tail -3
          echo '```'
          echo
          echo "## Contents"
          echo '```'
          unzip -l "$APK" | head -6
          echo '--- manifest / dex / libs ---'
          unzip -l "$APK" | awk '{print $4}' | grep -E '^AndroidManifest\.xml$|^classes[0-9]*\.dex$|^lib/' | head -40
          echo '--- signature files ---'
          unzip -l "$APK" | awk '{print $4}' | grep -E '^META-INF/.*\.(RSA|DSA|EC|SF)$' || echo '(none)'
          echo '```'
          echo
          echo "## Signature"
          echo '```'
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 || echo "(apksigner failed)"
          echo '```'
          echo
          echo "## Alignment"
          echo '```'
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" 2>&1 | tail -5 || echo "(zipalign failed)"
          echo '```'
          echo
          echo "## Manifest"
          echo '```'
          "$BUILD_TOOLS/aapt2" dump badging "$APK" 2>&1 | grep -E '^package|sdkVersion|targetSdkVersion|native-code|testOnly|application-label:' || true
          echo '--- first lines ---'
          "$BUILD_TOOLS/aapt2" dump badging "$APK" 2>&1 | head -15 || true
          echo '```'

      - name: Commit the report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/apk-doctor.md
          git commit -m 'chore: apk doctor report'
          git push
