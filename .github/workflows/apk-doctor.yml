name: APK verification

# Opens the APK that is actually published and prints what is inside it:
# signature schemes, certificate, alignment, ABIs and manifest flags. Android
# only says "package appears to be invalid"; this says why.
#
# Run it after every release. It downloads the asset through the same URL the
# download button uses, so it also proves that URL still resolves.

on:
  push:
    paths:
      - '.github/workflows/apk-doctor.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays: catch a release asset that rotted

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'babelish.apk' --dir /tmp/apk --clobber
          ls -l /tmp/apk

      - name: Inspect
        run: |
          set -uo pipefail
          APK=/tmp/apk/babelish.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          {
            echo "## The file"
            echo '```'
            ls -l "$APK"
            sha256sum "$APK"
            echo "size: $(stat -c%s "$APK") bytes"
            echo "zip magic: $(head -c 2 "$APK")"
            echo "APK Sig Block 42 count: $(grep -a -c 'APK Sig Block 42' "$APK" || true)"
            echo '```'
            echo
            echo "## Zip integrity"
            echo '```'
            unzip -t "$APK" 2>&1 | tail -2
            echo '```'
            echo
            echo "## Contents"
            echo '```'
            echo '--- v1/JAR signature files (expected: none at minSdk 24) ---'
            unzip -l "$APK" | awk '{print $4}' | grep -E '^META-INF/.*\.(RSA|DSA|EC|SF)$' || echo '(none — by design)'
            echo '--- ABIs ---'
            unzip -l "$APK" | awk '{print $4}' | grep -E '^lib/' | cut -d/ -f2 | sort -u
            echo '```'
            echo
            echo "## Signature"
            echo '```'
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 || echo '(apksigner failed)'
            echo '```'
            echo
            echo "## Alignment"
            echo '```'
            "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK" && echo 'zipalign 16 KiB: OK'
            echo '```'
            echo
            echo "## Manifest"
            echo '```'
            "$BUILD_TOOLS/aapt2" dump badging "$APK" 2>&1 | grep -E '^package|minSdkVersion|targetSdkVersion|native-code|testOnly|application-label:'
            echo '--- flags ---'
            "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>&1 | grep -E 'extractNativeLibs|testOnly|debuggable' || true
            echo '```'
          } | tee apk-report.md
          {
            echo '### Published APK'
            sed -n '/## Signature/,$p' apk-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the published file would not install
        run: |
          set -euo pipefail

          # v2 is the scheme every supported device understands (minSdk 24).
          # v1 (JAR) is deliberately absent: apksigner disables it at minSdk 24,
          # it is only needed for Android 6 and below, and it is the scheme the
          # Janus attack (CVE-2017-13156) abuses. v3 lets a future key rotation
          # reach Android 9+, so it is reported, not required.
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-report.md \
            || { echo '::error::no v2 signature — Android 11+ refuses this file'; exit 1; }
          grep -q 'Number of signers: 1' apk-report.md \
            || { echo '::error::expected exactly one signer'; exit 1; }
          grep -q 'zipalign 16 KiB: OK' apk-report.md \
            || { echo '::error::not 16 KiB aligned — Android 15 devices with 16 KB pages reject it'; exit 1; }
          grep -q "native-code: 'arm64-v8a'" apk-report.md \
            || { echo '::error::no arm64-v8a — most phones cannot run it'; exit 1; }

          # Same certificate as every build since 3.4.0. If this ever changes,
          # an existing install cannot be updated in place, so the workflow
          # fails instead of quietly shipping an APK people must uninstall.
          grep -q 'certificate SHA-1 digest: 5e8f16062ea3cd2c4a0d547876baa6f38cabf625' apk-report.md \
            || { echo '::error::signing identity changed — existing installs would refuse the update'; exit 1; }

          echo "the published APK passes every install gate"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-report
          path: apk-report.md
          retention-days: 30
